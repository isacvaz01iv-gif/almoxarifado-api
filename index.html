<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Almoxarifado - Login Mestre</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-card h2 { margin-bottom: 20px; color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
        .btn-login { width: 100%; padding: 12px; background-color: #007bff; border: none; border-radius: 4px; color: white; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-login:hover { background-color: #0056b3; }
        .erro-msg { color: red; font-size: 14px; margin-top: 10px; text-align: center; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Almoxarifado Rede</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="login">Usuário / Login</label>
                <input type="text" id="login" required placeholder="Ex: admin">
            </div>
            <div class="form-group">
                <label for="senha">Palavra-passe</label>
                <input type="password" id="senha" required placeholder="Sua palavra-passe">
            </div>
            <button type="submit" class="btn-login">Entrar no Sistema</button>
            <div id="erroMsg" class="erro-msg">Utilizador ou palavra-passe incorretos.</div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const loginInput = document.getElementById('login').value;
            const senhaInput = document.getElementById('senha').value;
            const erroMsg = document.getElementById('erroMsg');

            try {
                // Aqui fará a requisição para a nossa API na nuvem quando estiver online
                const resposta = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login: loginInput, senha: senhaInput })
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    alert('Login efetuado com sucesso! Bem-vindo, ' + dados.usuario.nome);
                    // Redirecionará para o painel principal nas próximas etapas
                } else {
                    erroMsg.style.display = 'block';
                    erroMsg.innerText = dados.erro || 'Erro ao efetuar login.';
                }
            } catch (err) {
                console.error(err);
                // Para testes visuais iniciais locais no telemóvel:
                if(loginInput === 'admin') {
                    alert('Login Mestre simulado com sucesso!');
                } else {
                    erroMsg.style.display = 'block';
                    erroMsg.innerText = 'Falha na conexão com o servidor.';
                }
            }
        });
    </script>
</body>
</html>
